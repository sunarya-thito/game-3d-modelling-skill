name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate repository
        run: python scripts/validate_repo.py . --strict --repository-root
      - name: Run tests
        run: python -m unittest discover -s tests -v

  blender:
    runs-on: ubuntu-latest
    env:
      BLENDER_VERSION: "4.2.5"
      BLENDER_SHA256: "cd28ab8164d88237c0c45a188ef7e4974bcb8c651de15fcbc3635166e584e4b3"
    steps:
      - uses: actions/checkout@v4
      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .tools/blender
          key: blender-${{ runner.os }}-${{ env.BLENDER_VERSION }}-${{ env.BLENDER_SHA256 }}
      - name: Install pinned Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          url="https://download.blender.org/release/Blender4.2/${archive}"
          mkdir -p .tools/blender
          curl --fail --location --retry 3 --output "${archive}" "${url}"
          echo "${BLENDER_SHA256}  ${archive}" | sha256sum --check
          tar --extract --xz --file "${archive}" --strip-components=1 --directory .tools/blender
      - name: Run Blender integration checks
        shell: bash
        run: |
          set -euo pipefail
          blender="${GITHUB_WORKSPACE}/.tools/blender/blender"
          "${blender}" --version
          for test in \
            tests/blender_meshkit_checks.py \
            tests/blender_surface_checks.py \
            tests/blender_animation_checks.py \
            tests/blender_audit_checks.py
          do
            "${blender}" --background --factory-startup --python-exit-code 1 --python "${test}"
          done
